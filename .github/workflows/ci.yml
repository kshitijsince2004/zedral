name: CI/CD — Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  # ─────────────────────────────────────────────
  # Backend: lint + test
  # ─────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install shared library
        run: pip install -e shared/

      - name: Install service dependencies
        run: |
          pip install -r services/m2-master/requirements.txt
          pip install -r services/m1-demand/requirements.txt
          pip install -r services/m5a-material/requirements.txt
          pip install -r services/m6-dispatch/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run shared library tests
        run: pytest shared/tests/ -v --tb=short
        continue-on-error: true

  # ─────────────────────────────────────────────
  # Frontend: build + deploy to VM via SCP
  # ─────────────────────────────────────────────
  deploy-frontends:
    runs-on: ubuntu-latest
    needs: [backend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build ops-console
        run: pnpm --filter @zedral/ops-console build
        env:
          VITE_USE_MOCK: "false"
          VITE_API_BASE_URL: ""
          VITE_KEYCLOAK_URL: ${{ secrets.VITE_KEYCLOAK_URL }}
          VITE_KEYCLOAK_REALM: ${{ secrets.VITE_KEYCLOAK_REALM }}
          VITE_KEYCLOAK_CLIENT_ID: ${{ secrets.VITE_KEYCLOAK_CLIENT_ID }}

      - name: Build floor-console
        run: pnpm --filter @zedral/floor-console build
        env:
          VITE_USE_MOCK: "false"
          VITE_API_BASE_URL: ""

      - name: Deploy frontend assets to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "apps/ops-console/dist/*"
          target: "/var/www/zedral/ops/"
          strip_components: 3

      - name: Deploy floor-console assets to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "apps/floor-console/dist/*"
          target: "/var/www/zedral/floor/"
          strip_components: 3

  # ─────────────────────────────────────────────
  # Backend: Deploy to GCP VM via SSH
  # ─────────────────────────────────────────────
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [backend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            echo "=== Pulling latest code ==="
            cd ~/zedral
            git fetch origin main
            git reset --hard origin/main

            echo "=== Rebuilding and restarting services ==="
            cd infra
            docker compose -f docker-compose.yml -f docker-compose.full.yml down
            docker compose -f docker-compose.yml -f docker-compose.full.yml up --build -d

            echo "=== Waiting for services to be healthy ==="
            sleep 20
            docker ps --format "table {{.Names}}\t{{.Status}}"

            echo "=== Deploy complete ==="
