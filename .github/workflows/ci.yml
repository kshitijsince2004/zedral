name: CI/CD — Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  # ─────────────────────────────────────────────
  # Backend: lint + test
  # ─────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install shared library
        run: pip install -e shared/

      - name: Install service dependencies
        run: |
          pip install -r services/m2-master/requirements.txt
          pip install -r services/m1-demand/requirements.txt
          pip install -r services/m5a-material/requirements.txt
          pip install -r services/m6-dispatch/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run shared library tests
        run: pytest shared/tests/ -v --tb=short
        continue-on-error: true

  # ─────────────────────────────────────────────
  # Deploy: All services (backend + frontend) via Docker on VM
  # ─────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [backend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            echo "=== Pulling latest code ==="
            cd ~/zedral
            git fetch origin main
            git reset --hard origin/main

            echo "=== Setting environment variables ==="
            cd infra
            cat > .env.frontend <<EOF
            VITE_KEYCLOAK_URL=${{ secrets.VITE_KEYCLOAK_URL }}
            VITE_KEYCLOAK_REALM=${{ secrets.VITE_KEYCLOAK_REALM }}
            VITE_KEYCLOAK_CLIENT_ID=${{ secrets.VITE_KEYCLOAK_CLIENT_ID }}
            EOF

            echo "=== Rebuilding and restarting all services ==="
            docker compose -f docker-compose.yml -f docker-compose.full.yml down
            docker compose -f docker-compose.yml -f docker-compose.full.yml up --build -d

            echo "=== Waiting for services to be healthy ==="
            sleep 30
            docker ps --format "table {{.Names}}\t{{.Status}}"

            echo "=== Deploy complete ==="
