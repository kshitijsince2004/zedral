name: CI/CD — Build & Deploy to GCP VM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ─────────────────────────────────────────────
  # Backend: lint + test
  # ─────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install shared library
        run: pip install -e shared/

      - name: Install service dependencies
        run: |
          pip install -r services/m2-master/requirements.txt
          pip install -r services/m1-demand/requirements.txt
          pip install -r services/m5a-material/requirements.txt
          pip install -r services/m6-dispatch/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run shared library tests
        run: pytest shared/tests/ -v --tb=short
        continue-on-error: true

  # ─────────────────────────────────────────────
  # Frontend: typecheck + build
  # ─────────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (floor-console)
        run: bun install
        working-directory: apps/floor-console

      - name: Typecheck (floor-console)
        run: bun run typecheck
        working-directory: apps/floor-console
        continue-on-error: true

      - name: Build (floor-console)
        run: bun run build
        working-directory: apps/floor-console

  # ─────────────────────────────────────────────
  # Deploy to GCP VM via SSH (main branch only)
  # ─────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            echo "=== Pulling latest code ==="
            cd ~/zedral
            git pull origin main

            echo "=== Rebuilding and restarting services ==="
            cd infra
            docker compose -f docker-compose.yml -f docker-compose.full.yml down
            docker compose -f docker-compose.yml -f docker-compose.full.yml up --build -d

            echo "=== Waiting for services to be healthy ==="
            sleep 20
            docker ps --format "table {{.Names}}\t{{.Status}}"

            echo "=== Deploy complete ==="
