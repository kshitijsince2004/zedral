worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # ── Upstream services ────────────────────────────────────────────────────
    upstream m2_master {
        server m2-master:8001;
    }
    upstream m1_demand {
        server m1-demand:8002;
    }
    upstream m5a_material {
        server m5a-material:8003;
    }
    upstream m6_dispatch {
        server m6-dispatch:8004;
    }

    # ── CORS helper ──────────────────────────────────────────────────────────
    map $http_origin $cors_origin {
        default "";
        "http://localhost:5173" "http://localhost:5173";
        "http://localhost:5174" "http://localhost:5174";
        # Production frontend origins — set CORS_ORIGINS env var and update before go-live
        "https://ops.zedral.hsl-ludhiana.local" "https://ops.zedral.hsl-ludhiana.local";
    }

    server {
        listen 8000;
        server_name _;

        # CORS preflight
        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
                add_header Access-Control-Max-Age 86400;
                return 204;
            }
            return 404;
        }

        # ── M2 Master Data (/api/m2/ → m2-master /api/v1/) ──────────────────
        location /api/m2/ {
            proxy_pass         http://m2_master/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header         Access-Control-Allow-Origin $cors_origin always;

            proxy_intercept_errors on;
            error_page 502 503 504 = @upstream_error;
        }

        # ── M1 Demand (/api/m1/ → m1-demand /api/v1/) ───────────────────────
        location /api/m1/ {
            proxy_pass         http://m1_demand/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header         Access-Control-Allow-Origin $cors_origin always;

            proxy_intercept_errors on;
            error_page 502 503 504 = @upstream_error;
        }

        # ── M5a Material (/api/m5a/ → m5a-material /api/v1/) ────────────────
        location /api/m5a/ {
            proxy_pass         http://m5a_material/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header         Access-Control-Allow-Origin $cors_origin always;

            proxy_intercept_errors on;
            error_page 502 503 504 = @upstream_error;
        }

        # ── M6 Dispatch (/api/m6/ → m6-dispatch /api/v1/) ───────────────────
        location /api/m6/ {
            proxy_pass         http://m6_dispatch/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header         Access-Control-Allow-Origin $cors_origin always;

            # SSE support — disable buffering for live-status endpoint
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;

            proxy_intercept_errors on;
            error_page 502 503 504 = @upstream_error;
        }

        # ── Health check passthrough ─────────────────────────────────────────
        location /health {
            return 200 '{"status":"ok","service":"nginx-gateway"}';
            add_header Content-Type application/json;
        }

        # ── Upstream error handler ───────────────────────────────────────────
        location @upstream_error {
            default_type application/json;
            return 502 '{"detail":"Service unavailable"}';
        }
    }
}
