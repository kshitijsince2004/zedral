worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # ── Upstream services ────────────────────────────────────────────────────
    upstream m2_master {
        server m2-master:8001;
    }
    upstream m1_demand {
        server m1-demand:8002;
    }
    upstream m5a_material {
        server m5a-material:8003;
    }
    upstream m6_dispatch {
        server m6-dispatch:8004;
    }
    upstream ops_console {
        server ops-console:3000;
    }
    upstream floor_console {
        server floor-console:3001;
    }
    upstream keycloak {
        server keycloak:8080;
    }

    # ══════════════════════════════════════════════════════════════════════════
    # ops.zedral.com — Ops Console
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name ops.zedral.com;

        # API proxies
        location /api/m2/ {
            proxy_pass http://m2_master/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/m1/ {
            proxy_pass http://m1_demand/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/m5a/ {
            proxy_pass http://m5a_material/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/m6/ {
            proxy_pass http://m6_dispatch/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # SSR app
        location / {
            proxy_pass http://ops_console;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            return 200 '{"status":"ok","service":"nginx-gateway"}';
            add_header Content-Type application/json;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # floor.zedral.com — Floor Console
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name floor.zedral.com;

        # API proxy (floor uses m6-dispatch)
        location /api/m6/ {
            proxy_pass http://m6_dispatch/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # SSR app
        location / {
            proxy_pass http://floor_console;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # auth.zedral.com — Keycloak
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name auth.zedral.com;

        location / {
            proxy_pass http://keycloak;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # Default — fallback for IP-based access
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80 default_server;
        server_name _;

        location /health {
            return 200 '{"status":"ok","service":"nginx-gateway"}';
            add_header Content-Type application/json;
        }

        location / {
            return 301 https://ops.zedral.com$request_uri;
        }
    }
}
