worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # ── Upstream services ────────────────────────────────────────────────────
    upstream m2_master {
        server m2-master:8001;
    }
    upstream m1_demand {
        server m1-demand:8002;
    }
    upstream m5a_material {
        server m5a-material:8003;
    }
    upstream m6_dispatch {
        server m6-dispatch:8004;
    }

    server {
        listen 8000;
        server_name _;

        # ── Ops Console static files (/) ─────────────────────────────────────
        # Volume mount: /var/www/zedral/ops/
        root /var/www/zedral/ops;

        # Cache hashed asset files (JS, CSS) with immutable caching
        location ~* \.(?:js|css)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Serve ops-console index.html with no-cache
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # Client-side routing fallback for ops-console
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Floor Console static files (/floor/) ────────────────────────────
        # Volume mount: /var/www/zedral/floor/
        # Uses root /var/www/zedral so /floor/* maps to /var/www/zedral/floor/*
        location ^~ /floor/ {
            root /var/www/zedral;

            # Cache hashed asset files (JS, CSS) with immutable caching
            location ~* ^/floor/.*\.(?:js|css)$ {
                root /var/www/zedral;
                add_header Cache-Control "public, max-age=31536000, immutable";
            }

            # Serve floor-console index.html with no-cache
            location = /floor/index.html {
                root /var/www/zedral;
                add_header Cache-Control "no-cache";
            }

            # Client-side routing fallback for floor-console
            try_files $uri $uri/ /floor/index.html;
        }

        # ── M2 Master Data (/api/m2/ → m2-master /api/v1/) ──────────────────
        location /api/m2/ {
            proxy_pass         http://m2_master/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_intercept_errors on;
            error_page 502 503 504 = @upstream_error;
        }

        # ── M1 Demand (/api/m1/ → m1-demand /api/v1/) ───────────────────────
        location /api/m1/ {
            proxy_pass         http://m1_demand/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_intercept_errors on;
            error_page 502 503 504 = @upstream_error;
        }

        # ── M5a Material (/api/m5a/ → m5a-material /api/v1/) ────────────────
        location /api/m5a/ {
            proxy_pass         http://m5a_material/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_intercept_errors on;
            error_page 502 503 504 = @upstream_error;
        }

        # ── M6 Dispatch (/api/m6/ → m6-dispatch /api/v1/) ───────────────────
        location /api/m6/ {
            proxy_pass         http://m6_dispatch/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE support — disable buffering for live-status endpoint
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;

            proxy_intercept_errors on;
            error_page 502 503 504 = @upstream_error;
        }

        # ── Health check passthrough ─────────────────────────────────────────
        location /health {
            return 200 '{"status":"ok","service":"nginx-gateway"}';
            add_header Content-Type application/json;
        }

        # ── Upstream error handler ───────────────────────────────────────────
        location @upstream_error {
            default_type application/json;
            return 502 '{"detail":"Service unavailable"}';
        }
    }
}
