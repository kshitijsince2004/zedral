[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
markers =
    smoke: Migration smoke tests
    idempotency: Migration idempotency tests
    seed: Seed data verification tests
    extension: Extension verification tests
    index: Index existence tests
    fk: Foreign key constraint tests
    cascade: Cascade delete tests
    property: Property-based tests for CHECK constraints and schema integrity
